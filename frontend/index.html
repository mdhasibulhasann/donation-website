<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Donate — Support the cause</title>
<meta name="description" content="Make a secure donation in Bangladeshi Taka via Moneybag." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <div class="card" id="donationCard">

      <div class="card__shape card__shape--one" aria-hidden="true"></div>
      <div class="card__shape card__shape--two" aria-hidden="true"></div>

      <header class="card__header">
        <div class="card__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21s-7.5-4.6-10-9.1C0.3 8.4 2 4.5 5.7 4c2-.3 3.8.6 5 2.2C11.9 4.6 13.7 3.7 15.7 4c3.7.5 5.4 4.4 3.7 7.9C21.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="card__title">Donate Here</h1>
        <p class="card__subtitle">Your small contribution can make a big difference.</p>
      </header>

      <form id="donationForm" novalidate>

        <fieldset class="field-group">
          <legend class="field-group__label">Choose an amount</legend>

          <div class="amount-grid" id="amountGrid" role="radiogroup" aria-label="Donation amount">
            <button type="button" class="amount-btn" data-amount="10" role="radio" aria-checked="false">৳10</button>
            <button type="button" class="amount-btn" data-amount="20" role="radio" aria-checked="false">৳20</button>
            <button type="button" class="amount-btn" data-amount="50" role="radio" aria-checked="false">৳50</button>
            <button type="button" class="amount-btn amount-btn--custom" data-amount="custom" role="radio" aria-checked="false">Custom</button>
          </div>

          <div class="custom-amount" id="customAmountWrap" hidden>
            <label class="visually-hidden" for="customAmount">Custom donation amount in Taka</label>
            <div class="custom-amount__field">
              <span class="custom-amount__symbol" aria-hidden="true">৳</span>
              <input
                type="number"
                id="customAmount"
                name="customAmount"
                inputmode="decimal"
                min="10"
                max="1000000"
                step="1"
                placeholder="Enter amount"
              />
            </div>
          </div>

          <p class="error-text" id="amountError" role="alert" hidden></p>

          <div class="amount-preview" id="amountPreview" hidden>
            <span>Donating</span>
            <strong id="amountPreviewValue">৳0</strong>
          </div>
        </fieldset>

        <fieldset class="field-group">
          <legend class="field-group__label">Your details</legend>

          <div class="input-row">
            <label class="input" for="fullName">
              <span class="input__label">Full name</span>
              <input type="text" id="fullName" name="fullName" autocomplete="name" required />
              <span class="error-text" data-error-for="fullName" role="alert" hidden></span>
            </label>
          </div>

          <div class="input-row input-row--two">
            <label class="input" for="email">
              <span class="input__label">Email address</span>
              <input type="email" id="email" name="email" autocomplete="email" required />
              <span class="error-text" data-error-for="email" role="alert" hidden></span>
            </label>

            <label class="input" for="phone">
              <span class="input__label">Phone number</span>
              <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="017XXXXXXXX" required />
              <span class="error-text" data-error-for="phone" role="alert" hidden></span>
            </label>
          </div>

          <div class="input-row">
            <label class="input" for="address">
              <span class="input__label">Address</span>
              <input type="text" id="address" name="address" autocomplete="street-address" required />
              <span class="error-text" data-error-for="address" role="alert" hidden></span>
            </label>
          </div>

          <div class="input-row input-row--two">
            <label class="input" for="city">
              <span class="input__label">City</span>
              <input type="text" id="city" name="city" autocomplete="address-level2" required />
              <span class="error-text" data-error-for="city" role="alert" hidden></span>
            </label>

            <label class="input" for="postcode">
              <span class="input__label">Postcode</span>
              <input type="text" id="postcode" name="postcode" autocomplete="postal-code" inputmode="numeric" required />
              <span class="error-text" data-error-for="postcode" role="alert" hidden></span>
            </label>
          </div>

          <div class="input-row">
            <label class="input input--static" for="country">
              <span class="input__label">Country</span>
              <input type="text" id="country" name="country" value="Bangladesh" disabled />
            </label>
          </div>
        </fieldset>

        <p class="form-status" id="formStatus" role="status" aria-live="polite" hidden></p>

        <button type="submit" class="submit-btn" id="submitBtn">
          <svg class="submit-btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="10" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/>
            <path d="M7 10V7a5 5 0 0 1 10 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="submit-btn__label">Proceed to Payment</span>
          <span class="submit-btn__spinner" aria-hidden="true"></span>
        </button>

        <p class="secure-note">Payments are processed securely by Moneybag. We never see or store your card details.</p>
      </form>

    </div>

    <p class="footer-note">Thank you for your support ❤️</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
